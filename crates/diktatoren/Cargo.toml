[package]
name = "diktatoren"
description = "Local on-demand dictation with wake word or push-to-talk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
audiocpp = { path = "../audiocpp" }
iced = { version = "0.14", features = ["tokio"] }
cpal = "0.18"
arboard = "3"
enigo = "0.6"
global-hotkey = "0.9"
interprocess = "2"
ureq = "3"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
toml = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
ashpd = { version = "0.13", features = ["tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[build-dependencies]
serde_json = "1"
hound = "3"
