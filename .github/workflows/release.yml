# Daily release builds of main. A release is tagged rNNNNN, the number of commits on main;
# days without new commits build nothing.
name: release

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=r$(printf '%05d' "$(git rev-list --count HEAD)")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64, features: "" }
          - { os: ubuntu-22.04, target: linux-x86_64-vulkan, features: "vulkan" }
          - { os: windows-2022, target: windows-x86_64, features: "" }
          - { os: macos-14, target: macos-arm64, features: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: true
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxdo-dev
          if [[ "${{ matrix.features }}" == *vulkan* ]]; then
            sudo apt-get install -y libvulkan-dev glslc
          fi
      - name: Build
        run: |
          features="${{ matrix.features }}"
          cargo build --release --locked -p diktatoren ${features:+--features audiocpp/$features}
      - name: Package
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          name="diktatoren-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp -r target/release/models "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          case "${{ runner.os }}" in
            Linux)
              cp target/release/diktatoren target/release/libaudiocpp.so.0 "dist/$name/"
              cp packaging/linux/* "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              ;;
            Windows)
              cp target/release/diktatoren.exe target/release/audiocpp.dll "dist/$name/"
              (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
              ;;
            macOS)
              cp target/release/diktatoren target/release/libaudiocpp*.dylib "dist/$name/"
              (cd dist && zip -qry "$name.zip" "$name")
              ;;
          esac
          rm -rf "dist/$name"
          (cd dist && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          {
            echo "Daily build of main at ${SHA:0:12}."
            echo
            echo "### Changes"
            if [[ -n "$previous" ]]; then
              git log --no-merges --format='- %s (%h)' "$previous..$SHA"
            else
              git log --no-merges --format='- %s (%h)' "$SHA"
            fi
          } > notes.md
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md dist/*
